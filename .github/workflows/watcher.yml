name: Watcher de pedidos PitStore

on:
  schedule:
    - cron: '*/5 * * * *'      # cada 5 minutos (minimo de GitHub)
  workflow_dispatch:            # boton para correrlo a mano

permissions:
  contents: write               # para guardar el estado (.watcher_seen.json)

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Revisar pedidos nuevos y avisar por Telegram
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_PHONES: ${{ secrets.TEST_PHONES }}
        run: python watcher.py --once

      - name: Guardar estado (pedidos ya avisados)
        run: |
          git config user.name "pitstore-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .watcher_seen.json
          git diff --staged --quiet || (git commit -m "estado watcher [skip ci]" && git pull --rebase --autostash && git push)
